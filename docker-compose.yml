# Desarrollo local: solo PostgreSQL, accesible únicamente desde esta máquina.
# Define la contraseña en tu entorno (no en este archivo):  export POSTGRES_PASSWORD="$(openssl rand -base64 18)"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en tu entorno}
      POSTGRES_DB: fitos
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["fitos-pg:/var/lib/postgresql/data"]
volumes:
  fitos-pg:
